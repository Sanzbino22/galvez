<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bernardo de Gálvez AR with Audio</title>
    <!-- Import Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f4f4f4;
        font-family: sans-serif;
      }
      model-viewer {
        width: 100%;
        height: 100%;
      }
      /* Floating audio control overlay */
      .audio-container {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 16px;
        border-radius: 30px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      audio {
        height: 35px;
        outline: none;
      }
    </style>
  </head>
  <body>

    <!-- Audio Player Bar using Galvez speech.mp3 -->
    <div class="audio-container">
      <audio controls>
        <source src="./Galvez speech.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>

    <!-- 3D AR Model Viewer using Galvez.glb -->
    <model-viewer 
      src="./Galvez.glb" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      shadow-intensity="1" 
      alt="Bernardo de Gálvez 3D Model"
      auto-rotate>
    </model-viewer>

  </body>
</html>
